name: Claude Auto Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # =========================================================================
  # Reviewer 1: correctness, scope, AGENTS.md conformance, ticket acceptance.
  # Backed by claude_review.py.
  # =========================================================================
  correctness_review:
    if: github.event.pull_request.draft == false
    runs-on: [self-hosted, self-hosted-novelhub]
    permissions:
      contents: read
      pull-requests: write
      issues: write
    outputs:
      verdict: ${{ steps.parse.outputs.verdict }}
      ticket_id: ${{ steps.ticket.outputs.num }}
      retry_count: ${{ steps.retry.outputs.count }}
      skipped: ${{ steps.ticket.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Count previous Claude reviews on this PR
        id: retry
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Only count reviews that produced a real REQUEST_CHANGES verdict.
          # Fallback comments (Anthropic API down -> verdict COMMENT and a
          # "WARNING" Severity row) and APPROVE/COMMENT verdicts must NOT
          # count toward the 3-iteration cap, otherwise temporary API
          # outages permanently jam a PR.
          COUNT=$(gh pr view ${{ github.event.pull_request.number }} \
            --json comments --jq \
            '[.comments[]
              | select(.body | startswith("## Claude Review"))
              | select(.body | test("### Verdict:?\\s*REQUEST_CHANGES"))
              | select(.body | contains("WARNING") | not)
            ] | length')
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "Previous REQUEST_CHANGES reviews on this PR: $COUNT"

      - name: Halt if retry limit reached
        if: steps.retry.outputs.count >= '3'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh pr comment ${{ github.event.pull_request.number }} --body "## Claude Review - STOPPED

          Maximum review iterations (3) reached. Halting auto-review loop to
          prevent runaway. A human needs to look at this PR before it can proceed."
          gh pr edit ${{ github.event.pull_request.number }} --add-label "needs-human-review" || true
          exit 1

      - name: Identify ticket from branch name
        id: ticket
        run: |
          set -euo pipefail
          BRANCH="${{ github.event.pull_request.head.ref }}"
          TICKET_NUM=$(echo "$BRANCH" | grep -oE 'feature/[0-9]{2}' | head -1 | cut -d/ -f2 || true)
          if [ -z "${TICKET_NUM:-}" ]; then
            echo "Branch '$BRANCH' is not a feature/<NN>-* branch; skipping Claude review"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "num=" >> "$GITHUB_OUTPUT"
            echo "file=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          TICKET_FILE=$(ls docs/tickets/${TICKET_NUM}-*.md 2>/dev/null | head -1 || true)
          if [ -z "${TICKET_FILE:-}" ]; then
            echo "No docs/tickets/${TICKET_NUM}-*.md found; skipping"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "num=$TICKET_NUM" >> "$GITHUB_OUTPUT"
            echo "file=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "num=$TICKET_NUM" >> "$GITHUB_OUTPUT"
          echo "file=$TICKET_FILE" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "Ticket: $TICKET_NUM ($TICKET_FILE)"

      - name: Get PR diff
        if: steps.ticket.outputs.skip == 'false'
        run: |
          set -euo pipefail
          git fetch origin ${{ github.event.pull_request.base.ref }}
          git diff origin/${{ github.event.pull_request.base.ref }}...HEAD > /tmp/pr.diff
          if [ "$(wc -c < /tmp/pr.diff)" -gt 200000 ]; then
            head -c 200000 /tmp/pr.diff > /tmp/pr.diff.trimmed
            echo "" >> /tmp/pr.diff.trimmed
            echo "[... diff truncated at 200KB; full diff has $(wc -c < /tmp/pr.diff) bytes ...]" >> /tmp/pr.diff.trimmed
          else
            cp /tmp/pr.diff /tmp/pr.diff.trimmed
          fi
          echo "Diff size: $(wc -c < /tmp/pr.diff.trimmed) bytes"

      - name: Verify Claude CLI
        if: steps.ticket.outputs.skip == 'false'
        run: |
          set -euo pipefail
          which claude
          claude --version

      - name: Run Claude correctness review
        if: steps.ticket.outputs.skip == 'false'
        env:
          TICKET_FILE: ${{ steps.ticket.outputs.file }}
          TICKET_NUM: ${{ steps.ticket.outputs.num }}
        run: |
          python3 .github/scripts/claude_review.py > /tmp/review.md
          echo "--- Correctness review preview ---"
          head -40 /tmp/review.md

      - name: Parse verdict
        if: steps.ticket.outputs.skip == 'false'
        id: parse
        run: |
          set -euo pipefail
          VERDICT=$(grep -oE '(APPROVE|REQUEST_CHANGES|COMMENT)' /tmp/review.md | tail -1 || echo "REQUEST_CHANGES")
          HEADING_VERDICT=$(grep -oE '^### Verdict:?\s*(APPROVE|REQUEST_CHANGES|COMMENT)' /tmp/review.md \
            | grep -oE '(APPROVE|REQUEST_CHANGES|COMMENT)' | tail -1 || true)
          if [ -n "${HEADING_VERDICT:-}" ]; then
            VERDICT="$HEADING_VERDICT"
          fi
          echo "verdict=$VERDICT" >> "$GITHUB_OUTPUT"
          echo "Parsed correctness verdict: $VERDICT"

      - name: Post correctness review comment
        if: steps.ticket.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment ${{ github.event.pull_request.number }} --body-file /tmp/review.md

      - name: Apply correctness verdict label
        if: steps.ticket.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr edit ${{ github.event.pull_request.number }} \
            --remove-label "claude-approved" --remove-label "claude-changes-requested" --remove-label "needs-human-review" 2>/dev/null || true
          case "${{ steps.parse.outputs.verdict }}" in
            APPROVE)
              gh pr edit ${{ github.event.pull_request.number }} --add-label "claude-approved"
              ;;
            REQUEST_CHANGES)
              gh pr edit ${{ github.event.pull_request.number }} --add-label "claude-changes-requested"
              ;;
            *)
              gh pr edit ${{ github.event.pull_request.number }} --add-label "needs-human-review"
              ;;
          esac

  # =========================================================================
  # Reviewer 2: independent security pass with non-overlapping checklist.
  # Backed by claude_security_review.py. Auto-merge needs both reviewers
  # to APPROVE.
  # =========================================================================
  security_review:
    if: github.event.pull_request.draft == false
    runs-on: [self-hosted, self-hosted-novelhub]
    permissions:
      contents: read
      pull-requests: write
    outputs:
      verdict: ${{ steps.parse.outputs.verdict }}
      skipped: ${{ steps.ticket.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Identify ticket from branch name
        id: ticket
        run: |
          set -euo pipefail
          BRANCH="${{ github.event.pull_request.head.ref }}"
          TICKET_NUM=$(echo "$BRANCH" | grep -oE 'feature/[0-9]{2}' | head -1 | cut -d/ -f2 || true)
          if [ -z "${TICKET_NUM:-}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "num=" >> "$GITHUB_OUTPUT"
            echo "file=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          TICKET_FILE=$(ls docs/tickets/${TICKET_NUM}-*.md 2>/dev/null | head -1 || true)
          if [ -z "${TICKET_FILE:-}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "num=$TICKET_NUM" >> "$GITHUB_OUTPUT"
            echo "file=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "num=$TICKET_NUM" >> "$GITHUB_OUTPUT"
          echo "file=$TICKET_FILE" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Get PR diff
        if: steps.ticket.outputs.skip == 'false'
        run: |
          set -euo pipefail
          git fetch origin ${{ github.event.pull_request.base.ref }}
          git diff origin/${{ github.event.pull_request.base.ref }}...HEAD > /tmp/pr.diff
          if [ "$(wc -c < /tmp/pr.diff)" -gt 200000 ]; then
            head -c 200000 /tmp/pr.diff > /tmp/pr.diff.trimmed
            echo "" >> /tmp/pr.diff.trimmed
            echo "[... diff truncated at 200KB ...]" >> /tmp/pr.diff.trimmed
          else
            cp /tmp/pr.diff /tmp/pr.diff.trimmed
          fi

      - name: Verify Claude CLI
        if: steps.ticket.outputs.skip == 'false'
        run: |
          set -euo pipefail
          which claude
          claude --version

      - name: Run Claude security review
        if: steps.ticket.outputs.skip == 'false'
        env:
          TICKET_FILE: ${{ steps.ticket.outputs.file }}
          TICKET_NUM: ${{ steps.ticket.outputs.num }}
        run: |
          python3 .github/scripts/claude_security_review.py > /tmp/security-review.md
          echo "--- Security review preview ---"
          head -40 /tmp/security-review.md

      - name: Parse security verdict
        if: steps.ticket.outputs.skip == 'false'
        id: parse
        run: |
          set -euo pipefail
          VERDICT=$(grep -oE '(APPROVE|REQUEST_CHANGES|COMMENT)' /tmp/security-review.md | tail -1 || echo "REQUEST_CHANGES")
          HEADING_VERDICT=$(grep -oE '^### Verdict:?\s*(APPROVE|REQUEST_CHANGES|COMMENT)' /tmp/security-review.md \
            | grep -oE '(APPROVE|REQUEST_CHANGES|COMMENT)' | tail -1 || true)
          if [ -n "${HEADING_VERDICT:-}" ]; then
            VERDICT="$HEADING_VERDICT"
          fi
          echo "verdict=$VERDICT" >> "$GITHUB_OUTPUT"
          echo "Parsed security verdict: $VERDICT"

      - name: Post security review comment
        if: steps.ticket.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment ${{ github.event.pull_request.number }} --body-file /tmp/security-review.md

  # =========================================================================
  # Mechanical gates: path policy + diff size cap.
  # =========================================================================
  path_size_policy:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    outputs:
      restricted: ${{ steps.path.outputs.restricted }}
      reason: ${{ steps.path.outputs.reason }}
      oversize: ${{ steps.size.outputs.oversize }}
      additions: ${{ steps.size.outputs.additions }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Get PR file list and stats
        id: stats
        env:
          BASE: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          git fetch origin "$BASE"
          git diff --name-only "origin/$BASE...HEAD" > /tmp/pr.files
          # numstat lets us compute size cap with arbitrary path exclusions;
          # shortstat would force us to count auto-generated files we want to
          # ignore (lockfiles, snapshots).
          git diff --numstat "origin/$BASE...HEAD" > /tmp/pr.numstat
          echo "Files changed:"
          cat /tmp/pr.files
          echo "Numstat:"
          cat /tmp/pr.numstat

      - name: Path policy
        id: path
        env:
          BASE: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          RESTRICTED="false"
          REASONS=()

          # 1. Restricted directories. Any match here flags regardless of content.
          MATCHED=$(grep -E '^(prisma/migrations/|\.github/workflows/|\.github/scripts/|apps/[^/]+/src/auth/|apps/[^/]+/src/billing/|apps/[^/]+/src/webhook/)' /tmp/pr.files || true)
          if [ -n "$MATCHED" ]; then
            RESTRICTED="true"
            REASONS+=("touches restricted path(s): $(echo "$MATCHED" | head -3 | tr '\n' ' ')")
          fi

          # 2. Real package.json dependency changes. Compare the dependencies
          # and devDependencies maps before vs after with jq so we ignore
          # script edits, name changes, and other metadata. Workspace links
          # ("workspace:*", "workspace:^", etc) are intentionally excluded —
          # they don't pull in new external code.
          PKG_FILES=$(grep -E 'package\.json$' /tmp/pr.files || true)
          DEPS_CHANGES=()
          for pkg in $PKG_FILES; do
            BEFORE=$(git show "origin/$BASE:$pkg" 2>/dev/null || echo "{}")
            AFTER=$(git show "HEAD:$pkg" 2>/dev/null || echo "{}")
            CHANGED=$(jq -n \
              --argjson before "$BEFORE" --argjson after "$AFTER" \
              '
              def deps(o): ((o.dependencies // {}) + (o.devDependencies // {}))
                | with_entries(select(.value | startswith("workspace:") | not));
              def keys_set(o): deps(o) | keys_unsorted;
              ((keys_set($after) - keys_set($before)) // []) as $added
              | ((keys_set($before) - keys_set($after)) // []) as $removed
              | ($added + $removed)
              | unique
              | join(", ")
              ')
            if [ -n "$CHANGED" ] && [ "$CHANGED" != "" ]; then
              DEPS_CHANGES+=("$pkg: $CHANGED")
            fi
          done
          if [ "${#DEPS_CHANGES[@]}" -gt 0 ]; then
            RESTRICTED="true"
            REASONS+=("non-workspace dependency change(s): $(printf '%s; ' "${DEPS_CHANGES[@]}")")
          fi

          # Emit reason as a multiline output so newlines survive.
          {
            echo "restricted=$RESTRICTED"
            echo "reason<<__REASON_EOF__"
            for r in "${REASONS[@]}"; do echo "- $r"; done
            echo "__REASON_EOF__"
          } >> "$GITHUB_OUTPUT"
          echo "Path policy: restricted=$RESTRICTED"
          for r in "${REASONS[@]}"; do echo "  - $r"; done

      - name: Size policy
        id: size
        env:
          SIZE_CAP: '800'
        run: |
          set -euo pipefail
          # Exclude auto-generated / non-source files from the cap. pnpm-lock.yaml
          # routinely runs into the thousands of lines and is not human-authored.
          ADDS=$(awk '
            $1 == "-" { next }                           # binary file
            $3 == "pnpm-lock.yaml" { next }
            $3 ~ /\/pnpm-lock\.yaml$/ { next }
            $3 ~ /^acceptance\// { next }                # plan-generated acceptance scripts
            { sum += $1 }
            END { print sum + 0 }
          ' /tmp/pr.numstat)
          OVER="false"
          if [ "$ADDS" -gt "$SIZE_CAP" ]; then
            OVER="true"
          fi
          echo "additions=$ADDS" >> "$GITHUB_OUTPUT"
          echo "oversize=$OVER" >> "$GITHUB_OUTPUT"
          echo "Size policy: additions=$ADDS oversize=$OVER (cap=$SIZE_CAP, lockfile + acceptance excluded)"

      - name: Label and comment if restricted path
        if: steps.path.outputs.restricted == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REASON: ${{ steps.path.outputs.reason }}
        run: |
          set -euo pipefail
          gh pr edit "$PR" --add-label "needs-human-merge"
          # Use --body-file so user-controlled REASON content is never
          # interpreted as gh CLI flags (`--ext` etc).
          {
            echo "## Path policy — auto-merge blocked"
            echo
            printf '%s\n' "$REASON"
            echo
            echo "Restricted paths: \`prisma/migrations/**\`, \`.github/workflows/**\`, \`.github/scripts/**\`, \`apps/*/src/{auth,billing,webhook}/**\`, and any non-workspace \`package.json\` dependency change."
            echo
            echo "Even if both Claude reviewers APPROVE, this PR will not auto-merge. A user must say \"PR #$PR go\" to Claude Code to proceed."
          } > /tmp/path_policy_comment.md
          gh pr comment "$PR" --body-file /tmp/path_policy_comment.md

      - name: Label and comment if oversize
        if: steps.size.outputs.oversize == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          ADDS: ${{ steps.size.outputs.additions }}
        run: |
          set -euo pipefail
          gh pr edit "$PR" --add-label "needs-split"
          {
            echo "## Size policy — too large to auto-merge"
            echo
            echo "This PR adds **$ADDS source lines** (excluding pnpm-lock.yaml and acceptance scripts), above the 800-line auto-merge cap."
            echo
            echo "Either split the work into smaller PRs (each < 800 net additions), or label \`human-approved\` after explicit user go-ahead. The reviewers will continue to run for visibility, but auto-merge will not fire."
          } > /tmp/size_policy_comment.md
          gh pr comment "$PR" --body-file /tmp/size_policy_comment.md

  # =========================================================================
  # Codex re-ping when EITHER reviewer requests changes (and within retry
  # budget).
  # =========================================================================
  ping_codex_to_fix:
    needs: [correctness_review, security_review]
    if: |
      needs.correctness_review.outputs.skipped == 'false' &&
      (needs.correctness_review.outputs.verdict == 'REQUEST_CHANGES' ||
       needs.security_review.outputs.verdict == 'REQUEST_CHANGES') &&
      needs.correctness_review.outputs.retry_count < '3'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      issues: write
    steps:
      - name: Ping Codex to address review
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ITERATION: ${{ needs.correctness_review.outputs.retry_count }}
          CORR: ${{ needs.correctness_review.outputs.verdict }}
          SEC: ${{ needs.security_review.outputs.verdict }}
        run: |
          NEXT_ITER=$((ITERATION + 1))
          gh pr comment ${{ github.event.pull_request.number }} --body "@codex

          Review verdicts: correctness=${CORR}, security=${SEC}. Auto-merge requires BOTH to be APPROVE.

          Please address every numbered fix in the most recent \`## Claude Review\` and \`## Claude Security Review\` comments and update this same PR branch. The reviews will re-run automatically.

          Codex Cloud note: your workspace may be on branch \`work\`, may not have a git \`origin\` remote, and may not have \`gh\` installed. That is normal. Use the Codex/GitHub integration to update this PR branch instead of stopping on missing local git remotes.

          Constraints:
          - Stay strictly within ticket scope. Do not add unrelated work.
          - No \`any\` types without a justifying comment.
          - No new dependencies not in AGENTS.md without flagging.
          - Re-run \`pnpm install --frozen-lockfile && pnpm lint && pnpm typecheck && pnpm test\` and paste real output in a PR comment when done.
          - If PR branch update fails, stop and comment with the exact error instead of claiming success.

          This is auto-iteration $NEXT_ITER of 3. After 3 iterations the pipeline halts for human review."

  # =========================================================================
  # Auto-merge: needs all three gates green plus non-blacklisted ticket.
  # =========================================================================
  auto_merge:
    needs: [correctness_review, security_review, path_size_policy]
    if: |
      needs.correctness_review.outputs.skipped == 'false' &&
      needs.correctness_review.outputs.verdict == 'APPROVE' &&
      needs.security_review.outputs.verdict == 'APPROVE' &&
      needs.path_size_policy.outputs.restricted == 'false' &&
      needs.path_size_policy.outputs.oversize == 'false'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
      pull-requests: write
      checks: read
    steps:
      - name: Decide merge policy by ticket
        id: policy
        env:
          # Tickets that REQUIRE human merge - security / payment / launch.
          BLOCKED: '03 05 06 11 14'
        run: |
          set -euo pipefail
          TICKET="${{ needs.correctness_review.outputs.ticket_id }}"
          if [ -z "${BLOCKED:-}" ]; then
            echo "auto=true" >> "$GITHUB_OUTPUT"
          elif echo " $BLOCKED " | grep -q " $TICKET "; then
            echo "auto=false" >> "$GITHUB_OUTPUT"
            echo "reason=Ticket $TICKET requires human review (security / payment / launch)" >> "$GITHUB_OUTPUT"
          else
            echo "auto=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Block auto-merge for security tickets
        if: steps.policy.outputs.auto == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr edit ${{ github.event.pull_request.number }} --add-label "needs-human-merge"
          gh pr comment ${{ github.event.pull_request.number }} --body "## Auto-merge blocked by ticket policy

          ${{ steps.policy.outputs.reason }}.

          Both Claude reviewers APPROVED, but tickets 03 (Auth), 05 (Coin Unlock), 06 (Stripe), 11 (FB CAPI), and 14 (Deployment) always require human go-ahead. Tell Claude Code \"PR #${{ github.event.pull_request.number }} go\" to merge."

      - name: Wait for Sanity Checks
        if: steps.policy.outputs.auto == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          for attempt in {1..60}; do
            RUN_ID=$(gh run list \
              --workflow "Sanity Checks" \
              --commit "$HEAD_SHA" \
              --event pull_request \
              --limit 1 \
              --json databaseId \
              --jq '.[0].databaseId // ""')

            if [ -z "$RUN_ID" ]; then
              echo "Sanity Checks run not registered yet (attempt $attempt/60)"
              sleep 5
              continue
            fi

            STATUS=$(gh run view "$RUN_ID" --json status --jq '.status')
            CONCLUSION=$(gh run view "$RUN_ID" --json conclusion --jq '.conclusion // ""')
            echo "Sanity Checks run $RUN_ID: status=$STATUS conclusion=${CONCLUSION:-pending}"

            if [ "$STATUS" = "completed" ]; then
              if [ "$CONCLUSION" = "success" ]; then
                exit 0
              fi
              echo "Sanity Checks did not pass: $CONCLUSION"
              exit 1
            fi

            sleep 5
          done

          echo "Timed out waiting for Sanity Checks"
          exit 1

      - name: Auto-merge non-blacklisted tickets
        if: steps.policy.outputs.auto == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh pr merge ${{ github.event.pull_request.number }} \
            --squash --delete-branch --auto || \
          gh pr merge ${{ github.event.pull_request.number }} \
            --squash --delete-branch
