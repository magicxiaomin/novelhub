name: E2E (Playwright)

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: novelhub
          POSTGRES_PASSWORD: novelhub_local
          POSTGRES_DB: novelhub
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U novelhub"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://novelhub:novelhub_local@localhost:5432/novelhub
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-secret-32chars-min-aaaaaaaa
      JWT_REFRESH_SECRET: ci-refresh-secret-32chars-min
      JWT_RESET_SECRET: ci-reset-secret-32chars-min
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_API_URL: http://localhost:4000
      NEXT_PUBLIC_IMAGE_HOST: picsum.photos
      # Dev escape hatch: chapter content is seeded under apps/api/static/chapters
      # and served by the API. The reader's host allowlist requires explicit
      # opt-in to fetch from the API host (production gates this off).
      NEXT_PUBLIC_DEV_ALLOW_API_CONTENT: 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 10.33.2

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: pnpm install --frozen-lockfile

      - name: Prisma migrate + seed
        run: |
          pnpm --filter @novelhub/db prisma:generate
          pnpm --filter @novelhub/db prisma:migrate-deploy
          pnpm --filter @novelhub/db prisma:seed

      - name: Build shared
        run: pnpm --filter @novelhub/shared build

      - name: Build API
        run: pnpm --filter @novelhub/api build

      - name: Build web
        run: pnpm --filter @novelhub/web build

      - name: Stage web standalone runtime
        run: |
          # Next standalone for monorepo emits server.js at apps/web/.next/standalone/apps/web/server.js;
          # the static + public dirs aren't copied automatically.
          cp -r apps/web/.next/static apps/web/.next/standalone/apps/web/.next/static
          cp -r apps/web/public apps/web/.next/standalone/apps/web/public

      - name: Start API (background)
        run: nohup pnpm --filter @novelhub/api start > /tmp/api.log 2>&1 &

      - name: Start web (background)
        env:
          PORT: '3000'
          HOSTNAME: '0.0.0.0'
          # CI-only deterministic drama SSR fixtures for this Playwright job.
          # Do not copy into production/staging deployment environments.
          NOVELHUB_E2E_DRAMA_FIXTURES: '1'
        run: nohup node apps/web/.next/standalone/apps/web/server.js > /tmp/web.log 2>&1 &

      - name: Wait for services
        run: |
          for i in {1..90}; do
            if curl -sf http://localhost:4000/health && curl -sf http://localhost:3000 -o /dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "Services did not become ready in time" >&2
          echo "--- api.log ---"
          tail -100 /tmp/api.log || true
          echo "--- web.log ---"
          tail -100 /tmp/web.log || true
          exit 1

      - name: Install Playwright browsers
        run: pnpm --filter @novelhub/e2e install-browsers

      - name: Run e2e
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000
        run: pnpm --filter @novelhub/e2e test

      - name: Upload Playwright report (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/e2e/playwright-report
          retention-days: 7
