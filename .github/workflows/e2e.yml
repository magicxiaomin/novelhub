name: E2E (Playwright)

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: novelhub
          POSTGRES_PASSWORD: novelhub_local
          POSTGRES_DB: novelhub
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U novelhub"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://novelhub:novelhub_local@localhost:5432/novelhub
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-secret-32chars-min-aaaaaaaa
      JWT_REFRESH_SECRET: ci-refresh-secret-32chars-min
      JWT_RESET_SECRET: ci-reset-secret-32chars-min
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_API_URL: http://localhost:4000
      NEXT_PUBLIC_IMAGE_HOST: picsum.photos
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 10.33.2

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: pnpm install --frozen-lockfile

      - name: Prisma migrate + seed
        run: |
          pnpm --filter @novelhub/db prisma:generate
          pnpm --filter @novelhub/db prisma:migrate-deploy
          pnpm --filter @novelhub/db prisma:seed

      - name: Build API
        run: pnpm --filter @novelhub/api build

      - name: Build web
        run: pnpm --filter @novelhub/web build

      - name: Start API (background)
        run: pnpm --filter @novelhub/api start &

      - name: Start web (background)
        run: pnpm --filter @novelhub/web start &

      - name: Wait for services
        run: |
          for i in {1..60}; do
            if curl -sf http://localhost:4000/health && curl -sf http://localhost:3000; then
              exit 0
            fi
            sleep 2
          done
          echo "Services did not become ready in time" >&2
          exit 1

      - name: Install Playwright browsers
        run: pnpm --filter @novelhub/e2e install-browsers

      - name: Run e2e
        run: pnpm --filter @novelhub/e2e test

      - name: Upload Playwright report (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/e2e/playwright-report
          retention-days: 7
