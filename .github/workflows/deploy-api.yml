name: Deploy API (Cloudflare Workers)

# Phase 2 (Cloudflare migration, Task 12): deploys the Worker bundle in
# apps/api/src/worker.ts to Cloudflare Workers. Replaces the Phase 1
# Vercel + VPS deploy flow.
#
# Trigger semantics:
#   - `workflow_run`: fires after "Migrate Production DB" completes on
#     `main`. We only deploy if migrate succeeded — a failed migration
#     leaves the DB in a state the new code can't safely run against.
#     Note: the migrate workflow's "secret-not-set → skip" path still
#     exits 0, so initial bring-up before the secret is wired works too.
#   - `workflow_dispatch`: manual override for hot-fix deploys when you
#     don't want to wait for / re-run a migration.
#
# Stages:
#   1. staging  → `wrangler deploy --env staging`     (always)
#   2. prod     → `wrangler deploy --env production`  (gated on staging)
#
# Each job is a no-op when Cloudflare secrets are not configured — that
# lets the workflow exist on `main` before the user has wired Cloudflare
# secrets, without breaking the pipeline. Once the repo variable
# `PRODUCTION_LIVE=true` is set, missing production secrets fail loudly.
#
# Required secrets:
#   CLOUDFLARE_API_TOKEN   - API token with `Workers Scripts:Edit`,
#                            `Workers KV Storage:Edit`, `Workers R2 Storage:Edit`
#                            on the deployment account.
#   CLOUDFLARE_ACCOUNT_ID  - Cloudflare account id (numeric / hex string
#                            from dash.cloudflare.com).
#
# Worker-side secrets (DATABASE_URL, JWT_SECRET, STRIPE_SECRET_KEY,
# SENTRY_DSN, FB_CAPI_*, R2_*, RESEND_API_KEY, etc.) are managed via
# `wrangler secret put <NAME> --env <env>` from a local terminal, NOT via
# this workflow. That keeps deploy-time tokens off the GitHub runner.
#
# Optional repo variable:
#   PRODUCTION_LIVE=true  - Once production is cut over and healthy,
#                           missing production deploy secrets fail the
#                           production job instead of skipping cleanly.

on:
  workflow_run:
    workflows: ['Migrate Production DB']
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Which env to deploy (defaults to both)'
        required: false
        default: 'both'
        type: choice
        options:
          - both
          - staging-only
          - production-only

concurrency:
  group: deploy-api-${{ github.ref }}
  cancel-in-progress: false

jobs:
  staging:
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Skip if Cloudflare not configured
        id: gate
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          MODE: ${{ github.event.inputs.environment }}
        run: |
          if [ -z "${TOKEN:-}" ]; then
            echo "CLOUDFLARE_API_TOKEN not set; Cloudflare not yet provisioned. Skipping."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          elif [ "${MODE:-both}" = "production-only" ]; then
            echo "Manual dispatch requested production-only; skipping staging."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: pnpm/action-setup@v3
        if: steps.gate.outputs.deploy == 'true'
        with:
          version: 10.33.2

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.deploy == 'true'
        with:
          node-version: 20
          cache: pnpm

      - name: Install (api workspace + transitive deps)
        if: steps.gate.outputs.deploy == 'true'
        run: pnpm install --frozen-lockfile --filter @novelhub/api...

      - name: Generate Prisma Client
        if: steps.gate.outputs.deploy == 'true'
        run: pnpm --filter @novelhub/db prisma:generate

      - name: Deploy Worker to staging
        if: steps.gate.outputs.deploy == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/api
          command: deploy --env staging

  production:
    runs-on: ubuntu-latest
    needs: [staging]
    # Run production after staging, but don't block on staging being skipped.
    # `needs.staging.result` is "success" when staging deployed OR was
    # skip-gated (steps with if: false still mark the job success).
    if: |
      always() &&
      needs.staging.result == 'success' &&
      (github.event_name == 'workflow_dispatch' ||
       github.event.workflow_run.conclusion == 'success')
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Skip if Cloudflare not configured
        id: gate
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MODE: ${{ github.event.inputs.environment }}
          PRODUCTION_LIVE: ${{ vars.PRODUCTION_LIVE }}
        run: |
          missing=""
          if [ -z "${TOKEN:-}" ]; then
            missing="CLOUDFLARE_API_TOKEN"
          fi
          if [ -z "${ACCOUNT_ID:-}" ]; then
            missing="${missing:+$missing, }CLOUDFLARE_ACCOUNT_ID"
          fi

          if [ -n "${missing}" ]; then
            if [ "${PRODUCTION_LIVE:-}" = "true" ]; then
              echo "::error::PRODUCTION_LIVE=true but required production deploy secret(s) are missing: ${missing}. Configure them before deploying production."
              exit 1
            fi
            echo "Cloudflare production secret(s) not set (${missing}); production not yet provisioned. Skipping."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          elif [ "${MODE:-both}" = "staging-only" ]; then
            echo "Manual dispatch requested staging-only; skipping production."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: pnpm/action-setup@v3
        if: steps.gate.outputs.deploy == 'true'
        with:
          version: 10.33.2

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.deploy == 'true'
        with:
          node-version: 20
          cache: pnpm

      - name: Install (api workspace + transitive deps)
        if: steps.gate.outputs.deploy == 'true'
        run: pnpm install --frozen-lockfile --filter @novelhub/api...

      - name: Generate Prisma Client
        if: steps.gate.outputs.deploy == 'true'
        run: pnpm --filter @novelhub/db prisma:generate

      - name: Deploy Worker to production
        if: steps.gate.outputs.deploy == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/api
          command: deploy --env production
