name: Staging Deploy

# On every push to main, SSH to the VPS and run the deploy script. The script
# is expected to live at ~/deploy-novelhub.sh on the host, owned by the SSH
# user, and to: pull main, install, build, restart the systemd unit / pm2
# process / docker container, and exit 0 only when the service is healthy.
#
# Required secrets:
#   STAGING_SSH_HOST     - hostname or IP of the VPS
#   STAGING_SSH_USER     - login user
#   STAGING_SSH_KEY      - private key (entire PEM, including BEGIN/END lines)
#   STAGING_SSH_PORT     - optional, defaults to 22
#
# If STAGING_SSH_HOST is unset, this workflow exits gracefully so the pipeline
# does not break before staging is wired up.

on:
  push:
    branches: [main]

concurrency:
  group: staging-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Skip if staging not configured
        id: gate
        env:
          HOST: ${{ secrets.STAGING_SSH_HOST }}
        run: |
          if [ -z "${HOST:-}" ]; then
            echo "STAGING_SSH_HOST not set; staging not configured. Skipping."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up SSH key
        if: steps.gate.outputs.configured == 'true'
        env:
          KEY: ${{ secrets.STAGING_SSH_KEY }}
          HOST: ${{ secrets.STAGING_SSH_HOST }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/staging_key
          chmod 600 ~/.ssh/staging_key
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Run deploy script over SSH
        if: steps.gate.outputs.configured == 'true'
        env:
          HOST: ${{ secrets.STAGING_SSH_HOST }}
          USER: ${{ secrets.STAGING_SSH_USER }}
          PORT: ${{ secrets.STAGING_SSH_PORT }}
        run: |
          set -euo pipefail
          PORT="${PORT:-22}"
          ssh -i ~/.ssh/staging_key -p "$PORT" \
            -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$USER@$HOST" \
            'bash -lc "~/deploy-novelhub.sh"'

      - name: Cleanup SSH key
        if: always() && steps.gate.outputs.configured == 'true'
        run: |
          rm -f ~/.ssh/staging_key
