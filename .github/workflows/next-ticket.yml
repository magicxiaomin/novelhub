name: Open Next Ticket

on:
  pull_request:
    types: [closed]
    branches: [main]

jobs:
  open_next:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4

      - name: Determine next ticket
        id: pick
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # Collect ticket numbers already merged (from feature/<NN>-* branches)
          MERGED=$(gh pr list --state merged --limit 200 \
            --json headRefName --jq \
            '[.[] | .headRefName | capture("feature/(?<n>[0-9]{2})-").n] | unique | sort | join(" ")' \
            || echo "")
          echo "Merged tickets: '$MERGED'"

          NEXT=""
          for n in 01 02 03 04 05 06 07 08 09 10 11 12 13 14; do
            if ! echo " $MERGED " | grep -q " $n "; then
              NEXT="$n"
              break
            fi
          done

          if [ -z "$NEXT" ]; then
            echo "All 14 tickets merged"
            echo "all_done=true" >> "$GITHUB_OUTPUT"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Don't open a duplicate issue / don't open while a PR is already in flight
          OPEN_ISSUES=$(gh issue list --label ticket --state open \
            --search "Ticket $NEXT" --json number --jq 'length')
          OPEN_PRS=$(gh pr list --state open --search "feature/$NEXT-" \
            --json number --jq 'length')

          if [ "$OPEN_ISSUES" != "0" ] || [ "$OPEN_PRS" != "0" ]; then
            echo "Ticket $NEXT already has open issue ($OPEN_ISSUES) or PR ($OPEN_PRS); skipping"
            echo "all_done=false" >> "$GITHUB_OUTPUT"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          TICKET_FILE=$(ls docs/tickets/${NEXT}-*.md | head -1)
          if [ -z "$TICKET_FILE" ]; then
            echo "ERROR: no docs/tickets/${NEXT}-*.md found"
            echo "all_done=false" >> "$GITHUB_OUTPUT"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # First line of ticket: "# Ticket NN: Title"
          RAW_TITLE=$(head -1 "$TICKET_FILE")
          TITLE=$(echo "$RAW_TITLE" | sed -E 's/^# (Ticket [0-9]+: )?//')
          SLUG=$(basename "$TICKET_FILE" .md | cut -c4-)

          {
            echo "num=$NEXT"
            echo "file=$TICKET_FILE"
            echo "title=$TITLE"
            echo "slug=$SLUG"
            echo "all_done=false"
            echo "skip=false"
          } >> "$GITHUB_OUTPUT"

      - name: Open issue for next ticket
        if: steps.pick.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TICKET_NUM: ${{ steps.pick.outputs.num }}
          TICKET_FILE: ${{ steps.pick.outputs.file }}
          TICKET_TITLE: ${{ steps.pick.outputs.title }}
          TICKET_SLUG: ${{ steps.pick.outputs.slug }}
        run: |
          set -euo pipefail
          cat > /tmp/body.md <<EOF
          @codex

          Implement Ticket ${TICKET_NUM}.

          **Read first (in full):**
          - \`AGENTS.md\` - project conventions, strict
          - \`${TICKET_FILE}\` - the ticket itself

          **Steps:**
          1. Target branch \`feature/${TICKET_NUM}-${TICKET_SLUG}\` from latest \`main\`
          2. Implement everything in the ticket's "Tasks" section
          3. Make every "Acceptance Criteria" item pass with concrete evidence
          4. Write all tests required by the ticket
          5. Run \`pnpm install --frozen-lockfile && pnpm lint && pnpm typecheck && pnpm test\`, plus any ticket-specific validation commands, and paste real output (not "all green") into the PR description
          6. Open a PR with title following Conventional Commits, e.g. \`feat(<scope>): ${TICKET_TITLE}\`, linking to \`${TICKET_FILE}\`
          7. Reference this issue with \`Closes #<issue-number>\` so it auto-closes on merge

          **Codex Cloud publishing notes:**
          - The Codex workspace may be on branch \`work\`, may not have a git \`origin\` remote, and may not have \`gh\` installed. That is normal. Do not stop just because \`git remote -v\` is empty.
          - Use the Codex/GitHub integration to publish changes to \`feature/${TICKET_NUM}-${TICKET_SLUG}\` and create the PR.
          - If PR creation or branch publication fails, stop and comment here with the exact error. Do not claim a PR was opened unless a GitHub PR URL exists.

          **Constraints:**
          - Stay strictly within ticket scope. Do not add unrelated features.
          - No \`any\` types without a justifying comment.
          - No new dependencies beyond what AGENTS.md lists, unless flagged in the PR description with reason.
          - JWT in HTTP-only cookie, not localStorage. Bcrypt cost factor 12. Stripe webhook signature verification mandatory. event_id passed end-to-end for FB CAPI.
          - Stop and ask if anything in the ticket is ambiguous BEFORE coding.

          After the PR opens, Claude will auto-review. If changes are requested, address every numbered fix in that review and update the same PR branch through the Codex/GitHub integration - review will re-run automatically (max 3 iterations).
          EOF

          gh issue create \
            --title "[Ticket ${TICKET_NUM}] ${TICKET_TITLE}" \
            --label "codex,ticket,auto-pipeline" \
            --body-file /tmp/body.md

      - name: Pipeline complete notice
        if: steps.pick.outputs.all_done == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Idempotent: only create the "all done" issue once
          EXISTING=$(gh issue list --search "Pipeline complete: all 14 tickets" \
            --state all --json number --jq 'length')
          if [ "$EXISTING" = "0" ]; then
            gh issue create \
              --title "Pipeline complete: all 14 tickets merged" \
              --body "All NovelHub MVP tickets have been merged via the auto-pipeline. Run the final QA checklist from \`docs/tickets/14-deployment-qa.md\` before going live." \
              || echo "Could not create completion notice (non-fatal)"
          fi
