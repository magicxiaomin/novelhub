name: Open Next Ticket

# Two triggers:
#   - repository_dispatch (event_type: staging_healthy): fired by
#     staging-healthcheck.yml after a clean 30-min window. This is the
#     production trigger once staging is wired up.
#   - pull_request closed+merged: legacy fallback while staging is not yet
#     configured. The job below skips this path when STAGING_REQUIRED repo
#     variable is "true", so once you flip that variable, only the dispatch
#     trigger opens new tickets.

on:
  pull_request:
    types: [closed]
    branches: [main]
  repository_dispatch:
    types: [staging_healthy]

jobs:
  open_next:
    if: |
      (github.event_name == 'repository_dispatch') ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.merged == true &&
       vars.STAGING_REQUIRED != 'true')
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4

      - name: Determine next ticket
        id: pick
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # Collect ticket numbers already merged (from feature/<NN>-* branches)
          MERGED=$(gh pr list --state merged --limit 200 \
            --json headRefName --jq \
            '[.[] | .headRefName | capture("feature/(?<n>[0-9]{2})-").n] | unique | sort | join(" ")' \
            || echo "")
          echo "Merged tickets: '$MERGED'"

          NEXT=""
          for n in 01 02 03 04 05 06 07 08 09 10 11 12 13 14; do
            if ! echo " $MERGED " | grep -q " $n "; then
              NEXT="$n"
              break
            fi
          done

          if [ -z "$NEXT" ]; then
            echo "All 14 tickets merged"
            echo "all_done=true" >> "$GITHUB_OUTPUT"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Don't open a duplicate issue / don't open while a PR is already in flight
          OPEN_ISSUES=$(gh issue list --label ticket --state open \
            --search "Ticket $NEXT" --json number --jq 'length')
          OPEN_PRS=$(gh pr list --state open --search "feature/$NEXT-" \
            --json number --jq 'length')

          if [ "$OPEN_ISSUES" != "0" ] || [ "$OPEN_PRS" != "0" ]; then
            echo "Ticket $NEXT already has open issue ($OPEN_ISSUES) or PR ($OPEN_PRS); skipping"
            echo "all_done=false" >> "$GITHUB_OUTPUT"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          TICKET_FILE=$(ls docs/tickets/${NEXT}-*.md | head -1)
          if [ -z "$TICKET_FILE" ]; then
            echo "ERROR: no docs/tickets/${NEXT}-*.md found"
            echo "all_done=false" >> "$GITHUB_OUTPUT"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # First line of ticket: "# Ticket NN: Title"
          RAW_TITLE=$(head -1 "$TICKET_FILE")
          TITLE=$(echo "$RAW_TITLE" | sed -E 's/^# (Ticket [0-9]+: )?//')
          SLUG=$(basename "$TICKET_FILE" .md | cut -c4-)

          {
            echo "num=$NEXT"
            echo "file=$TICKET_FILE"
            echo "title=$TITLE"
            echo "slug=$SLUG"
            echo "all_done=false"
            echo "skip=false"
          } >> "$GITHUB_OUTPUT"

      - name: Open issue for next ticket
        if: steps.pick.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TICKET_NUM: ${{ steps.pick.outputs.num }}
          TICKET_FILE: ${{ steps.pick.outputs.file }}
          TICKET_TITLE: ${{ steps.pick.outputs.title }}
          TICKET_SLUG: ${{ steps.pick.outputs.slug }}
        run: |
          set -euo pipefail
          # Stub body only — no @codex mention, no assignee. The `needs-plan` label
          # triggers claude-plan.yml, which generates the full implementation plan +
          # acceptance script, appends them here, and ONLY THEN mentions @codex /
          # assigns the Codex connector bot. Until that happens Codex must not start.
          cat > /tmp/body.md <<EOF
          Ticket ${TICKET_NUM} — pending plan generation.

          - Ticket file: \`${TICKET_FILE}\`
          - Project conventions: \`AGENTS.md\`
          - Target branch (Codex will create): \`feature/${TICKET_NUM}-${TICKET_SLUG}\`

          The \`needs-plan\` label on this issue triggers \`claude-plan.yml\`, which
          will append a full implementation plan and a machine-checkable acceptance
          script to this body, then mention @codex and assign the Codex connector.
          **Do not start coding until the plan is appended below** (label changes
          to \`plan-ready\`).
          EOF

          ISSUE_URL=$(gh issue create \
            --title "[Ticket ${TICKET_NUM}] ${TICKET_TITLE}" \
            --label "ticket,auto-pipeline,needs-plan" \
            --body-file /tmp/body.md)
          echo "Created issue: $ISSUE_URL"

      - name: Pipeline complete notice
        if: steps.pick.outputs.all_done == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Idempotent: only create the "all done" issue once
          EXISTING=$(gh issue list --search "Pipeline complete: all 14 tickets" \
            --state all --json number --jq 'length')
          if [ "$EXISTING" = "0" ]; then
            gh issue create \
              --title "Pipeline complete: all 14 tickets merged" \
              --body "All NovelHub MVP tickets have been merged via the auto-pipeline. Run the final QA checklist from \`docs/tickets/14-deployment-qa.md\` before going live." \
              || echo "Could not create completion notice (non-fatal)"
          fi
