name: Migrate Production DB

# Phase 1 (Vercel): the migration step lived here because Vercel doesn't
# support a "pre-deploy" command — push to main, this workflow runs
# `prisma migrate deploy` against Supabase Postgres BEFORE Vercel's deploy
# hook fires. Vercel deploys take ~3 min; migrations take seconds, so
# finishing first was reliably ordered.
#
# Phase 2 (Cloudflare migration, Task 11): the same workflow keeps running
# pre-deploy. The reason it MUST point at the Direct (port 5432) connection
# is now twofold:
#   1. Prisma `migrate deploy` needs session-mode SQL — pgbouncer
#      transaction mode (Supabase pooler) breaks DDL.
#   2. The Worker connects to Postgres via Hyperdrive (Cloudflare's pooler),
#      so a single `PRODUCTION_DATABASE_URL` secret would be ambiguous: the
#      Worker secret points at the Hyperdrive-fronted URL, the migration job
#      needs the raw Supabase Direct URL. To prevent the two from getting
#      crossed, this workflow uses an explicitly-named
#      `PRODUCTION_DATABASE_URL_DIRECT` secret.
#
# If migration fails: this workflow exits non-zero. The Cloudflare deploy
# (deploy-api.yml — Task 12) will gate on this workflow's success via
# `workflow_run`, so a failed migration prevents a broken deploy.
#
# Required secrets:
#   PRODUCTION_DATABASE_URL_DIRECT  - Supabase Postgres connection string,
#                                     Direct connection on port 5432.
#                                     Format: postgresql://USER:PASS@HOST:5432/DB
#                                     Do NOT use the Supabase pooler URL or
#                                     a Hyperdrive HTTP URL here.
#
# Optional repo variable:
#   PRODUCTION_LIVE=true            - Once production is cut over and healthy,
#                                     missing required secrets fail the workflow
#                                     instead of skipping cleanly.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: migrate-on-deploy
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Skip if PRODUCTION_DATABASE_URL_DIRECT not configured
        id: gate
        env:
          DB_URL: ${{ secrets.PRODUCTION_DATABASE_URL_DIRECT }}
          PRODUCTION_LIVE: ${{ vars.PRODUCTION_LIVE }}
        run: |
          if [ -z "${DB_URL:-}" ]; then
            if [ "${PRODUCTION_LIVE:-}" = "true" ]; then
              echo "::error::PRODUCTION_LIVE=true but PRODUCTION_DATABASE_URL_DIRECT is not set. Configure the secret before deploying production."
              exit 1
            fi
            echo "PRODUCTION_DATABASE_URL_DIRECT not set; production not yet provisioned. Skipping."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: pnpm/action-setup@v3
        if: steps.gate.outputs.configured == 'true'
        with:
          version: 10.33.2

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.configured == 'true'
        with:
          node-version: 20

      - name: Install (db package only)
        if: steps.gate.outputs.configured == 'true'
        run: pnpm install --frozen-lockfile --filter @novelhub/db

      - name: Generate Prisma Client
        if: steps.gate.outputs.configured == 'true'
        run: pnpm --filter @novelhub/db prisma:generate

      - name: Run prisma migrate deploy
        if: steps.gate.outputs.configured == 'true'
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL_DIRECT }}
        run: pnpm --filter @novelhub/db prisma:migrate-deploy
