# Cloudflare Workers config — Task 2 (Phase 0/migration). Populated incrementally
# by the Cloudflare migration tasks. Until Task 12 (deploy-api workflow), this
# config is local-dev only — `wrangler dev` reads it.
#
# Bindings (R2, KV, Hyperdrive) are STUBBED with placeholder ids/names. The user
# fills these in via the Cloudflare dashboard / `wrangler hyperdrive create` /
# `wrangler kv namespace create` once they're ready to deploy. For local
# `wrangler dev`, miniflare auto-mocks bindings — no real Cloudflare account
# needed to start the dev server.

name = "novelhub-api"
main = "src/worker.ts"
compatibility_date = "2026-05-01"
compatibility_flags = ["nodejs_compat"]
account_id = "0ead643bec90bb38a1f209ec3cec02bb"

# Production-equivalent build pipeline. Wrangler bundles src/worker.ts via
# esbuild. We don't run `tsc --build` here — TypeScript types are checked
# separately via `pnpm typecheck:worker` (see package.json).
[build]
command = ""

# Local dev defaults — `wrangler dev` runs on http://localhost:8787 unless
# overridden. The Nest stack uses 4000; keep them disjoint.
[dev]
port = 8787

# ---- Bindings ---------------------------------------------------------------
# R2 (cover + chapter content). Bucket name matches Phase 1 R2_BUCKET=novelhub-content.
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "novelhub-content"
preview_bucket_name = "novelhub-content-preview"

# KV (support contact rate-limit + future rate-limit primitives). Single
# namespace shared between staging and production — rate-limit keys are
# IP+email-scoped, so cross-env collision isn't a real risk.
[[kv_namespaces]]
binding = "KV"
id = "6a22d526fa6841439f4b5517fe821730"

# Hyperdrive (Postgres connection pooler in front of Supabase Session pooler
# port 5432). Top-level value is the production-scoped binding; staging
# overrides via [[env.staging.hyperdrive]] below. Production id is filled in
# by user once production Supabase + Hyperdrive create are done.
# [[hyperdrive]]
# binding = "HYPERDRIVE"
# id = ""

# ---- Environments -----------------------------------------------------------
# Staging — pre-prod smoke before promoting to production. Same bindings, just
# different bucket prefixes / kv namespaces. Routes filled in at Task 12.
[env.staging]
name = "novelhub-api-staging"
# routes = [{ pattern = "api-staging.novelhub.com/*", custom_domain = true }]

[[env.staging.r2_buckets]]
binding = "BUCKET"
bucket_name = "novelhub-content-staging"
preview_bucket_name = "novelhub-content-preview"

[[env.staging.kv_namespaces]]
binding = "KV"
id = "6a22d526fa6841439f4b5517fe821730"

[[env.staging.hyperdrive]]
binding = "HYPERDRIVE"
id = "ee7db7e85d78487796c06ba032a8c469"

[env.production]
name = "novelhub-api"
# Custom domain wired via Cloudflare API after first deploy (workers/domains
# endpoint). Don't set `routes = ...` here — that conflicts with the custom
# domain bind. See cutover runbook 2026-05-10.

[[env.production.r2_buckets]]
binding = "BUCKET"
bucket_name = "novelhub-content"
preview_bucket_name = "novelhub-content-preview"

[[env.production.kv_namespaces]]
binding = "KV"
id = "6a22d526fa6841439f4b5517fe821730"

[[env.production.hyperdrive]]
binding = "HYPERDRIVE"
id = "7598b12e346d473b99d2e9ca4f64d054"

# ---- Cron triggers ----------------------------------------------------------
# Worker scheduled() handler in src/worker.ts dispatches by event.cron.
# Keep these schedule strings in sync with the constants at the top of that
# handler (CRON_RE_ENGAGEMENT, CRON_RENEWAL_REMINDER). Local: trigger a tick
# via `wrangler dev --test-scheduled` then `curl http://localhost:8787/__scheduled`.
[triggers]
crons = [
  "0 */6 * * *",   # re-engagement: every 6 hours on the hour
  "0 9 * * *",     # renewal-reminders: 09:00 UTC daily
]
